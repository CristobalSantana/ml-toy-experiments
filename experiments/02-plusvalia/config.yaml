# Reproducible configuration for Experiment 02 (plusvalía).
# CRITERIA.md is the frozen pre-registration; this file holds the concrete
# parameters that implement it. Anything here that CRITERIA.md fixes (target,
# metrics, seeds, split protocol, drift cutoff) must match it exactly.

seed: 0

data:
  # relative to the repo root
  sii_processed: datasets/ch/sii_cadastre/processed/sii_rol_level.csv
  ipv_processed: datasets/ch/bcch_ipv/processed/ipv_quarterly.csv

target:
  source_column: avaluo_uf_per_m2   # avalúo fiscal / m² built, in UF
  transform: log10                  # CRITERIA.md: primary target is log10(UF/m²)
  name: log10_avaluo_uf_per_m2

# --- cleaning: quirks measured in the raw SII data, not guessed ---
cleaning:
  year_min: 1900          # 34 rows carry impossible years (e.g. 1514)
  year_max: 2026
  quality_min: 1          # 405 rows fall outside the documented 1..5 scale
  quality_max: 5
  floors_max: 70          # tallest building in Chile is ~64 floors; raw max is 224
  min_built_area_m2: 10   # below this, avalúo/m² is dominated by rounding
  target_band: [0.5, 500] # UF/m² plausibility band (100% of rows already inside)

features:
  numeric:
    - log10_sup_construida_m2
    - log10_sup_terreno_m2      # 0 for apartments -> see es_departamento
    - calidad_ponderada          # 1=Superior .. 5=Inferior
    - anio_construccion
    - edad_anios
    - n_pisos
    - n_lineas_construccion
  categorical:
    - comuna_nombre              # 8 levels
    - material_predom            # C=albañilería, B=hormigón, E=madera, ...
  boolean:
    - es_departamento            # sup_terreno == 0 (land sits in the bien común rol)

  # Columns that reconstruct the target and must never be fed to a model.
  # avaluo_exento is not a theoretical risk: it equals avaluo_fiscal_total in
  # 51.1% of rows, and there exento/superficie/UF correlates 1.000000 with the
  # target. contribucion_semestral is the territorial tax, a fixed rate times
  # the avalúo, so it is the target times a constant.
  forbidden:
    - avaluo_fiscal_total
    - avaluo_exento
    - contribucion_semestral
    - avaluo_uf_per_m2
    - log10_avaluo_uf_per_m2

group_key:
  # Leakage rule: rows from the same block never span train and test.
  columns: [comuna_code, manzana]
  name: manzana_id

split:
  holdout_manzana_frac: 0.10   # frozen, untouched until the final run
  n_folds: 5                   # grouped K-fold by manzana
  seeds: [0, 1, 2, 3, 4]       # every reported number is mean ± spread over these

leakage:
  # A feature whose |Spearman| with the target exceeds this is treated as a
  # deterministic reconstruction and aborts the run.
  max_abs_spearman: 0.999
  # A feature f is also rejected if log(f) reconstructs log(avalúo) - i.e. if
  # f is the avalúo in disguise - above this R².
  max_reconstruction_r2: 0.99
  # ...or if this share of rows collapses onto a single constant residual,
  # which is how a *partial* leak shows up. avaluo_exento equals the avalúo in
  # 51% of rows and differs in the rest: its global R² looks unremarkable while
  # half the dataset is exactly reconstructible, so the R² test alone passes it.
  max_exact_reconstruction_frac: 0.005
